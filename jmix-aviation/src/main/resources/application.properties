main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/aviation
main.datasource.username=sa
main.datasource.password=

main.liquibase.change-log=com/company/aviation/liquibase/changelog.xml

jmix.ui.login-view-id=aviation_LoginView
jmix.ui.main-view-id=aviation_MainView
jmix.ui.menu-config=com/company/aviation/menu.xml
jmix.ui.composite-menu=true

jmix.core.available-locales=en,ru

ui.login.defaultUsername=admin
